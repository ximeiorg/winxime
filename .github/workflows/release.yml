name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.3.1-test). Leave empty to use timestamp tag"
        required: false
        default: ""

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  release:
    runs-on: ubuntu-latest
    name: Release
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: Unsigned Installer (MSI)
          path: dist
      - name: Download MSIX
        uses: actions/download-artifact@v4
        with:
          name: MSIX Package
          path: dist
      - name: Calculate Checksums
        run: |
          cd dist
          for f in *.msi *.msix; do
            [ -f "$f" ] && sha256sum "$f" > "$f.sha256"
          done
      - name: GH Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_name != '' && inputs.tag_name || format('nightly-{0}', github.run_number)) || github.ref_name }}
          name: 曦码·曜 ${{ github.event_name == 'workflow_dispatch' && (inputs.tag_name != '' && inputs.tag_name || format('nightly-{0}', github.run_number)) || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: dist/*